<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Candela{% endblock %} — Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=16">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <img src="/static/candela-logo-white.png" alt="Candela" class="brand-logo">
    </div>
    <nav class="nav">
      <a href="/" class="{{ 'active' if active == 'dashboard' else '' }}">Dashboard</a>
      <a href="/projects" class="{{ 'active' if active == 'projects' else '' }}">Projects</a>
      <a href="/quotations" class="{{ 'active' if active == 'quotations' else '' }}">Quotations</a>
      <a href="/stock" class="{{ 'active' if active == 'stock' else '' }}">Stock</a>
      <a href="/products" class="{{ 'active' if active == 'products' else '' }}">Products</a>
      <a href="/datasheets" class="{{ 'active' if active == 'datasheets' else '' }}">Datasheets</a>
      <a href="/customers" class="{{ 'active' if active == 'customers' else '' }}">Customers</a>
      <a href="/activity" class="{{ 'active' if active == 'activity' else '' }}">Activity</a>
    </nav>
    <div class="sidebar-foot">
      <a href="#" id="user-name-link">Signed in as —</a>
    </div>
  </aside>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
<script src="/static/app.js?v=16"></script>
<script src="/static/datatable.js?v=16"></script>
{% block script %}{% endblock %}
</body>
</html>
