{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Dashboard</h1>
  <div class="head-actions"><span id="report-btns"></span></div>
</div>

<!-- The money, at a glance -->
<div class="hero">
  <a class="hero-cell" href="/projects?stage=open">
    <div class="hero-label">Pipeline</div>
    <div class="hero-num" id="h-pipeline">—</div>
    <div class="hero-sub" id="h-pipeline-n"></div>
  </a>
  <a class="hero-cell" href="/projects?stage=orders">
    <div class="hero-label">Order book</div>
    <div class="hero-num accent" id="h-orders">—</div>
    <div class="hero-sub" id="h-orders-n"></div>
  </a>
  <a class="hero-cell" href="/projects?stage=closed">
    <div class="hero-label">Completed</div>
    <div class="hero-num" id="h-done">—</div>
    <div class="hero-sub" id="h-done-n"></div>
  </a>
</div>

<!-- What needs doing: counts only, details on click -->
<div class="pulse" id="pulse"></div>
<div class="pulse-list" id="pulse-list"></div>

<!-- Where the jobs are: one flow per division. Lighting jobs end at
     Delivered; installation and commissioning are automation work only. -->
<div class="flows" id="flows"></div>
{% endblock %}

{% block script %}
<script>
document.getElementById('report-btns').innerHTML = reportButtons('dashboard');
const STAGES = ['enquiry','quoted','approved','ordered','delivered','installed','commissioned','closed'];
const LABEL = { enquiry: 'Enquiry', quoted: 'Quoted', approved: 'Approved', ordered: 'Ordered',
  delivered: 'Delivered', installed: 'Installed', commissioned: 'Commissioned', closed: 'Closed' };
const PIPE = ['enquiry', 'quoted'];
const ORDERS = ['approved', 'ordered', 'delivered', 'installed', 'commissioned'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// "AED 1.25M" / "AED 48.6K" - the hero shows scale, not cents
function short(v) {
  if (!v) return 'AED 0';
  if (v >= 1e6) return 'AED ' + (v / 1e6).toFixed(v >= 1e7 ? 1 : 2) + 'M';
  if (v >= 1e3) return 'AED ' + (v / 1e3).toFixed(v >= 1e5 ? 0 : 1) + 'K';
  return 'AED ' + Math.round(v);
}
const sum = (t, keys, f) => keys.reduce((a, k) => a + (t[k] ? t[k][f] : 0), 0);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

let attention = [];

function renderHero(board) {
  const t = board.totals;
  const set = (id, v) => { document.getElementById(id).textContent = v; };
  set('h-pipeline', short(sum(t, PIPE, 'value')));
  set('h-pipeline-n', plural(sum(t, PIPE, 'count'), 'project'));
  set('h-orders', short(sum(t, ORDERS, 'value')));
  set('h-orders-n', plural(sum(t, ORDERS, 'count'), 'job') + ' running');
  set('h-done', short(t.closed.value));
  set('h-done-n', plural(t.closed.count, 'project'));
}

function renderPulse(awaiting, lowStock, att) {
  attention = att.items;
  const urgent = att.items.filter(i => i.priority === 1).length;
  const chips = [
    { n: awaiting, label: 'awaiting client', href: '/quotations#sent', cls: 'blue' },
    { n: att.total, label: 'to act on', toggle: true, cls: urgent ? 'red' : 'amber' },
    { n: lowStock, label: 'low stock', href: '/stock', cls: lowStock ? 'red' : 'grey' },
  ];
  document.getElementById('pulse').innerHTML = chips.map(c => c.toggle
    ? `<button type="button" class="chip ${c.cls} ${c.n ? '' : 'zero'}" onclick="toggleList()" ${c.n ? '' : 'disabled'}>
         <span class="chip-n">${c.n}</span><span class="chip-l">${c.label}</span>${c.n ? '<span class="chip-caret">▾</span>' : ''}</button>`
    : `<a class="chip ${c.cls} ${c.n ? '' : 'zero'}" href="${c.href}"><span class="chip-n">${c.n}</span><span class="chip-l">${c.label}</span></a>`
  ).join('');
}

function toggleList() {
  const el = document.getElementById('pulse-list');
  if (el.classList.toggle('open')) {
    el.innerHTML = attention.map(i => `
      <a class="pl-item" href="${i.href}"><span class="pl-dot ${i.kind}"></span>${esc(i.title)}</a>`).join('');
  }
}

// Stages each division goes through
const DIVISION_FLOWS = [
  { key: 'lighting', label: 'Lighting', stages: STAGES.filter(s => s !== 'installed' && s !== 'commissioned') },
  { key: 'automation', label: 'Automation', stages: STAGES },
];

function renderFlows(board) {
  const all = STAGES.flatMap(s => (board.board[s] || []).map(p => ({ ...p, stage: s })));
  const html = DIVISION_FLOWS.map(d => {
    const mine = all.filter(p => p.division === d.key);
    // An older Lighting job already at Installed / Commissioned still shows
    const stages = STAGES.filter(s => d.stages.includes(s) || mine.some(p => p.stage === s));
    const count = s => mine.filter(p => p.stage === s).length;
    const value = s => mine.filter(p => p.stage === s).reduce((a, p) => a + (p.value || 0), 0);
    const max = Math.max(1, ...stages.map(count));
    const running = mine.filter(p => ORDERS.includes(p.stage));
    const cols = stages.map(s => {
      const n = count(s);
      const h = n ? Math.max(14, Math.round(n / max * 100)) : 4;
      return `<a class="flow-col ${n ? '' : 'empty'}" href="/projects?stage=${s}#division=${d.key}" title="${plural(n, 'project')} · ${short(value(s))}">
        <div class="flow-n">${n}</div>
        <div class="flow-bar-box"><div class="flow-bar ${ORDERS.includes(s) ? 'run' : (s === 'closed' ? 'done' : 'pipe')}" style="height:${h}%"></div></div>
        <div class="flow-l">${LABEL[s]}</div>
      </a>`;
    }).join('');
    return `<div class="flow-wrap">
      <div class="flow-head">
        <a class="flow-title" href="/projects#division=${d.key}">${d.label}</a>
        <span class="flow-meta">${plural(mine.length, 'project')} · ${short(running.reduce((a, p) => a + (p.value || 0), 0))} order book</span>
      </div>
      <div class="flow${stages.length <= 6 ? ' flow-short' : ''}" style="--cols:${stages.length}">${cols}</div>
    </div>`;
  }).join('');
  const unset = all.filter(p => !p.division).length;
  document.getElementById('flows').innerHTML = html + (unset
    ? `<a class="flow-unset" href="/projects#division=unset">${plural(unset, 'project')} with no division yet — set Lighting or Automation so ${unset === 1 ? 'it shows' : 'they show'} here →</a>`
    : '');
}

(async () => {
  try {
    const [board, quotations, lowStock, att] = await Promise.all([
      api('/projects/board/summary'), api('/quotations/'), api('/stock/low-stock'), api('/projects/board/attention'),
    ]);
    renderHero(board);
    renderPulse(quotations.filter(q => q.status === 'sent').length, lowStock.length, att);
    renderFlows(board);
  } catch (e) {
    toast('Could not load dashboard: ' + e.message, true);
  }
})();
</script>
{% endblock %}
