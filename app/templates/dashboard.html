{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Dashboard</h1>
</div>

<div class="stat-row" id="stat-row">
  <a class="stat" href="/projects"><div class="num">—</div><div class="label">Projects</div></a>
  <a class="stat" href="/quotations"><div class="num">—</div><div class="label">Quotations</div></a>
  <a class="stat" href="/products"><div class="num">—</div><div class="label">Products</div></a>
  <a class="stat warn" href="/stock"><div class="num">—</div><div class="label">Low stock</div></a>
</div>

<div class="panel">
  <div class="panel-head">
    <h2>Pipeline</h2>
    <a href="/projects" class="panel-link">All projects →</a>
  </div>
  <div class="funnel" id="funnel"></div>
  <div class="stage-detail" id="stage-detail"></div>
</div>
{% endblock %}

{% block script %}
<script>
const STAGE_LABELS = {
  enquiry: 'Enquiry', quoted: 'Quoted', approved: 'Approved', ordered: 'Ordered',
  delivered: 'Delivered', installed: 'Installed', commissioned: 'Commissioned', closed: 'Closed',
};
let boardData = null;
let selectedStage = null;

function renderFunnel() {
  const { stages, totals } = boardData;
  const peak = Math.max(1, ...stages.map(s => totals[s].count));
  document.getElementById('funnel').innerHTML = stages.map(s => {
    const t = totals[s];
    const empty = t.count === 0;
    const pct = empty ? 0 : Math.max(14, (t.count / peak) * 100);
    return `
      <button class="funnel-stage ${s === selectedStage ? 'selected' : ''} ${empty ? 'empty' : ''}"
              onclick="selectStage('${s}')">
        <div class="fs-bar-track"><div class="fs-bar" style="height:${pct}%"></div></div>
        <div class="fs-count">${t.count}</div>
        <div class="fs-label">${STAGE_LABELS[s]}</div>
      </button>`;
  }).join('');
}

function selectStage(stage) {
  selectedStage = (selectedStage === stage) ? null : stage;
  renderFunnel();
  renderStageDetail();
}

function projectCard(p) {
  return `
    <a class="pcard" href="/projects/view/${p.id}">
      <span class="pcard-num">${p.project_number}</span>
      <div class="pcard-name">${p.name}</div>
    </a>`;
}

function renderStageDetail() {
  const el = document.getElementById('stage-detail');
  const { board, stages } = boardData;

  if (!selectedStage) {
    const active = stages.filter(s => s !== 'closed').flatMap(s => board[s]);
    el.innerHTML = active.length
      ? `<div class="pcard-grid">${active.map(projectCard).join('')}</div>`
      : `<div class="empty-state"><p>No active projects.</p></div>`;
    return;
  }

  const items = board[selectedStage] || [];
  el.innerHTML = `
    <div class="stage-detail-head">${STAGE_LABELS[selectedStage]}
      <button class="clear-stage" onclick="selectStage('${selectedStage}')">show all</button>
    </div>
    ${items.length
      ? `<div class="pcard-grid">${items.map(projectCard).join('')}</div>`
      : `<div class="empty-state"><p>Nothing here.</p></div>`}`;
}

async function loadDashboard() {
  try {
    const [board, products, quotations, lowStock] = await Promise.all([
      api('/projects/board/summary'),
      api('/products/'),
      api('/quotations/'),
      api('/stock/low-stock'),
    ]);
    boardData = board;

    const row = document.getElementById('stat-row');
    row.children[0].querySelector('.num').textContent = board.active_count;
    row.children[1].querySelector('.num').textContent = quotations.length;
    row.children[2].querySelector('.num').textContent = products.length;
    row.children[3].querySelector('.num').textContent = lowStock.length;

    renderFunnel();
    renderStageDetail();
  } catch (e) {
    toast('Could not load dashboard: ' + e.message, true);
  }
}

loadDashboard();
</script>
{% endblock %}
