{% extends "base.html" %}
{% block title %}Products{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Products</h1>
    <p>Your light fitting and home automation catalog.</p>
  </div>
  <button class="btn" id="show-add-btn">+ Add product</button>
</div>

<div class="panel" id="add-panel" style="display:none;">
  <h2>Add a product</h2>
  <form id="product-form">
    <div class="form-grid">
      <div class="field"><label>SKU</label><input name="sku" required placeholder="CND-LED-001"></div>
      <div class="field"><label>Name</label><input name="name" required placeholder="LED Downlight 12W"></div>
      <div class="field"><label>Category</label><input name="category" placeholder="Downlights, Smart Switches, ..."></div>
      <div class="field"><label>Brand</label><input name="brand" placeholder="Optional"></div>
      <div class="field"><label>Unit</label><input name="unit" value="pcs"></div>
      <div class="field"><label>Reorder level</label><input name="reorder_level" type="number" value="0"></div>
      <div class="field"><label>Cost price (AED)</label><input name="cost_price" type="number" step="0.01" value="0"></div>
      <div class="field"><label>Selling price (AED)</label><input name="selling_price" type="number" step="0.01" value="0"></div>
      <div class="field span2"><label>Spec summary (used as default quotation description)</label><textarea name="spec_summary" rows="3" placeholder="Source : LED&#10;CCT : 3000K&#10;Power : 12W&#10;IP Rating : IP65"></textarea></div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn">Save product</button>
      <button type="button" class="btn btn-ghost" id="cancel-btn">Cancel</button>
    </div>
    <p style="color:var(--muted); font-size:12.5px; margin-top:10px;">
      Photo and datasheets are added on the product's own page after saving.
    </p>
  </form>
</div>

<div class="panel">
  <div id="products-table"></div>
</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img">
</div>
{% endblock %}

{% block script %}
<script>
let productsCache = [];
let datasheetCounts = {};

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

document.getElementById('show-add-btn').addEventListener('click', () => {
  document.getElementById('add-panel').style.display = 'block';
  document.getElementById('show-add-btn').style.display = 'none';
});
document.getElementById('cancel-btn').addEventListener('click', () => {
  document.getElementById('add-panel').style.display = 'none';
  document.getElementById('show-add-btn').style.display = '';
  document.getElementById('product-form').reset();
});

async function deleteProduct(id, name) {
  if (!confirm(`Remove "${name}" from the catalog?`)) return;
  try {
    await api('/products/' + id, { method: 'DELETE' });
    toast('Product removed');
    loadProducts();
  } catch (err) { toast(err.message, true); }
}

async function loadProducts() {
  const [products, datasheets] = await Promise.all([api('/products/'), api('/datasheets/')]);
  productsCache = products;
  datasheetCounts = {};
  datasheets.forEach(d => {
    if (d.product_id) datasheetCounts[d.product_id] = (datasheetCounts[d.product_id] || 0) + 1;
  });

  DataTable.render({
    containerId: 'products-table',
    storageKey: 'products',
    emptyMessage: 'No products yet — add your first light fitting or automation product above.',
    columns: [
      { key: 'photo', label: 'Photo', sortable: false, width: '56px', value: () => '', render: p => p.image_path
          ? `<img src="${p.image_path}" class="thumb" onclick="event.stopPropagation(); openLightbox('${p.image_path}')" title="Click to enlarge">`
          : `<div class="thumb-empty"></div>` },
      { key: 'sku', label: 'SKU', value: p => p.sku, render: p => `<a href="/products/view/${p.id}" class="mono">${p.sku}</a>` },
      { key: 'name', label: 'Name', value: p => p.name, render: p => `<a href="/products/view/${p.id}">${p.name}</a>` },
      { key: 'category', label: 'Category', value: p => p.category || '', render: p => p.category || '—' },
      { key: 'datasheets', label: 'Datasheets', numeric: true, value: p => datasheetCounts[p.id] || 0,
        render: p => datasheetCounts[p.id] ? `<span class="badge">${datasheetCounts[p.id]}</span>` : '—' },
      { key: 'cost_price', label: 'Cost', numeric: true, value: p => p.cost_price, render: p => fmtMoney(p.cost_price) },
      { key: 'selling_price', label: 'Selling price', numeric: true, value: p => p.selling_price, render: p => fmtMoney(p.selling_price) },
      { key: 'reorder_level', label: 'Reorder level', numeric: true, value: p => p.reorder_level, render: p => p.reorder_level },
    ],
    rows: productsCache,
    actions: p => `
      <a class="btn btn-ghost btn-sm" href="/products/view/${p.id}">Open</a>
      <button class="btn btn-ghost btn-sm btn-danger" onclick="deleteProduct(${p.id}, '${p.name.replace(/'/g, "\\'")}')">Delete</button>
    `,
  });
}

document.getElementById('product-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = formToJSON(e.target);
  payload.cost_price = parseFloat(payload.cost_price || 0);
  payload.selling_price = parseFloat(payload.selling_price || 0);
  payload.reorder_level = parseInt(payload.reorder_level || 0);
  try {
    const product = await api('/products/', { method: 'POST', body: JSON.stringify(payload) });
    toast('Product added — add a photo and datasheets on its page');
    location.href = '/products/view/' + product.id;
  } catch (err) { toast(err.message, true); }
});

loadProducts();
</script>
{% endblock %}
