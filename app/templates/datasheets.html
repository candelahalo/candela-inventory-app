{% extends "base.html" %}
{% block title %}Datasheets{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Datasheets</h1>
    <p>Manufacturer spec sheets for every product and accessory.</p>
  </div>
  <button class="btn" onclick="document.getElementById('add-panel').style.display='block'; this.style.display='none';">+ Upload datasheet</button>
</div>

<div class="panel" id="add-panel" style="display:none;">
  <h2>Upload a datasheet</h2>
  <form id="datasheet-form">
    <div class="form-grid">
      <div class="field span2"><label>Title</label><input name="title" required placeholder="Igniz Zoom - Track Spotlight"></div>
      <div class="field"><label>Brand</label><input name="brand" placeholder="Halo, One Light, ..."></div>
      <div class="field"><label>Category</label><input name="category" placeholder="Track Lighting, LED Drivers, ..."></div>
      <div class="field span2"><label>Link to product (optional)</label><select name="product_id" id="ds-product"><option value="">— None —</option></select></div>
      <div class="field span2"><label>PDF file</label><input type="file" id="ds-file" accept="application/pdf" required></div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn">Upload</button>
      <button type="button" class="btn btn-ghost" onclick="document.getElementById('add-panel').style.display='none';">Cancel</button>
    </div>
  </form>
</div>

<div class="panel">
  <div class="form-grid" style="grid-template-columns: 1fr 1fr; margin-bottom:18px;">
    <div class="field"><label>Filter by brand</label><select id="filter-brand"><option value="">All brands</option></select></div>
    <div class="field"><label>Filter by category</label><select id="filter-category"><option value="">All categories</option></select></div>
  </div>
  <div id="datasheets-table"></div>
</div>
{% endblock %}

{% block script %}
<script>
let productsCache = [];
let allDatasheets = [];

async function loadProductOptions() {
  productsCache = await api('/products/');
  document.getElementById('ds-product').innerHTML += productsCache.map(p => `<option value="${p.id}">${p.sku} — ${p.name}</option>`).join('');
}

function renderDatasheets(list) {
  DataTable.render({
    containerId: 'datasheets-table',
    storageKey: 'datasheets',
    emptyMessage: 'No datasheets yet — upload manufacturer spec sheets above to build your reference library.',
    columns: [
      { key: 'title', label: 'Title', value: d => d.title, render: d => d.title },
      { key: 'brand', label: 'Brand', value: d => d.brand || '', render: d => d.brand || '—' },
      { key: 'category', label: 'Category', value: d => d.category || '', render: d => d.category || '—' },
      { key: 'product', label: 'Linked product', value: d => { const p = productsCache.find(x => x.id === d.product_id); return p ? p.sku : ''; }, render: d => { const p = productsCache.find(x => x.id === d.product_id); return p ? p.sku + ' — ' + p.name : '—'; } },
      { key: 'uploaded', label: 'Uploaded', value: d => d.uploaded_at, render: d => fmtDate(d.uploaded_at) },
    ],
    rows: list,
    actions: d => `
      <a class="btn btn-ghost btn-sm" href="/datasheets/${d.id}/preview" target="_blank">Preview</a>
      <a class="btn btn-ghost btn-sm" href="/datasheets/${d.id}/download">Download</a>
      <button class="btn btn-ghost btn-sm btn-danger" onclick="deleteDatasheet(${d.id})">Delete</button>
    `,
  });
}

function applyFilters() {
  const brand = document.getElementById('filter-brand').value;
  const category = document.getElementById('filter-category').value;
  let filtered = allDatasheets;
  if (brand) filtered = filtered.filter(d => d.brand === brand);
  if (category) filtered = filtered.filter(d => d.category === category);
  renderDatasheets(filtered);
}

async function loadDatasheets() {
  allDatasheets = await api('/datasheets/');
  const brands = [...new Set(allDatasheets.map(d => d.brand).filter(Boolean))].sort();
  const categories = [...new Set(allDatasheets.map(d => d.category).filter(Boolean))].sort();
  document.getElementById('filter-brand').innerHTML = '<option value="">All brands</option>' + brands.map(b => `<option value="${b}">${b}</option>`).join('');
  document.getElementById('filter-category').innerHTML = '<option value="">All categories</option>' + categories.map(c => `<option value="${c}">${c}</option>`).join('');
  renderDatasheets(allDatasheets);
}

async function deleteDatasheet(id) {
  if (!confirm('Delete this datasheet?')) return;
  try {
    await api('/datasheets/' + id, { method: 'DELETE' });
    toast('Datasheet deleted');
    loadDatasheets();
  } catch (err) { toast(err.message, true); }
}

document.getElementById('filter-brand').addEventListener('change', applyFilters);
document.getElementById('filter-category').addEventListener('change', applyFilters);

document.getElementById('datasheet-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const file = document.getElementById('ds-file').files[0];
  if (!file) { toast('Choose a PDF file', true); return; }

  const fd = new FormData();
  fd.append('title', form.title.value);
  fd.append('brand', form.brand.value);
  fd.append('category', form.category.value);
  if (form.product_id.value) fd.append('product_id', form.product_id.value);
  fd.append('file', file);

  try {
    const res = await fetch('/datasheets/', { method: 'POST', body: fd, headers: { 'X-User-Name': getUserName() } });
    if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.detail || 'Upload failed'); }
    toast('Datasheet uploaded');
    form.reset();
    document.getElementById('add-panel').style.display = 'none';
    loadDatasheets();
  } catch (err) {
    toast(err.message, true);
  }
});

(async () => {
  await loadProductOptions();
  await loadDatasheets();
})();
</script>
{% endblock %}
