{% extends "base.html" %}
{% block title %}Projects{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Projects</h1>
    <p>Every supply & installation job, enquiry through close-out.</p>
  </div>
  <div class="head-actions"><span id="report-btns"></span>
    <button class="btn" id="show-add-btn">+ New project</button></div>
</div>

<div class="panel" id="add-panel" style="display:none;">
  <h2 id="form-title">New project</h2>
  <form id="project-form">
    <input type="hidden" id="editing-id">
    <div class="form-grid">
      <div class="field span2"><label>Project name</label><input name="name" required placeholder="Villa 44 — Full Home Automation"></div>
      <div class="field"><label>Customer</label><select name="customer_id" id="p-customer" required></select></div>
      <div class="field"><label>Division</label>
        <select name="division" id="p-division">
          <option value="">Not set</option>
          <option value="lighting">Lighting</option>
          <option value="automation">Automation</option>
        </select>
      </div>
      <div class="field"><label>Category</label>
        <select name="category" id="p-category">
          <option value="">Not set</option>
          <option value="retail">Retail</option>
          <option value="residential">Residential</option>
        </select>
      </div>
      <div class="field"><label>Start date</label><input name="start_date" type="date"></div>
      <div class="field"><label>Target completion</label><input name="target_completion_date" type="date"></div>
      <div class="field span2"><label>Site address</label><textarea name="site_address" rows="2"></textarea></div>
      <div class="field span2"><label>Notes</label><textarea name="notes" rows="2"></textarea></div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn">Save project</button>
      <button type="button" class="btn btn-ghost" id="cancel-btn">Cancel</button>
    </div>
  </form>
</div>

<!-- Division (Lighting / Automation) on top, Retail / Residential under it -->
<div class="tabs" id="division-tabs" role="tablist"></div>
<div class="chips" id="category-chips"></div>

<div class="stage-filter" id="stage-filter" style="display:none;"></div>
<div class="panel"><div id="projects-table"></div></div>
<!-- Shown when deleting a project that has quotations linked to it -->
<div id="del-overlay" class="modal-overlay" onclick="if (event.target === this) closeDeleteDialog()">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="del-title">
    <h2 id="del-title">Delete project</h2>
    <p class="modal-sub" id="del-sub"></p>
    <div id="del-body" style="font-size:14px; line-height:1.55;"></div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" onclick="closeDeleteDialog()">Cancel</button>
      <button type="button" class="btn btn-ghost" id="del-keep">Delete project, keep quotations</button>
      <button type="button" class="btn btn-ghost btn-danger" id="del-all">Delete project and quotations</button>
    </div>
  </div>
</div>
{% endblock %}

{% block script %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Exports follow the division tab and category chip that are showing.
  document.getElementById('report-btns').innerHTML = reportButtons('projects', { extra: 'projectsReportParams()' });
});

let customersCache = [];
let projectsCache = [];

// What's showing: a division tab (Lighting / Automation) and, under it, a
// category chip (Retail / Residential). Kept in the URL
// (#division=lighting&category=retail) so a refresh or shared link lands on
// the same view. An old #retail / #residential link still works.
const DIVISION_LABELS = { lighting: 'Lighting', automation: 'Automation' };
const CATEGORY_LABELS = { retail: 'Retail', residential: 'Residential' };
let activeDivision = 'all';
let activeCategory = 'all';
function readProjectHash() {
  activeDivision = 'all'; activeCategory = 'all';
  const h = location.hash.slice(1);
  if (!h) return;
  if (!h.includes('=')) { if (CATEGORY_LABELS[h]) activeCategory = h; return; }
  const p = new URLSearchParams(h);
  const d = p.get('division'), c = p.get('category');
  if (DIVISION_LABELS[d] || d === 'unset') activeDivision = d;
  if (CATEGORY_LABELS[c] || c === 'unset') activeCategory = c;
}
readProjectHash();
// A link that only changes the #... part doesn't reload the page
window.addEventListener('hashchange', () => { readProjectHash(); renderProjects(); });

function writeProjectHash() {
  const p = new URLSearchParams();
  if (activeDivision !== 'all') p.set('division', activeDivision);
  if (activeCategory !== 'all') p.set('category', activeCategory);
  const h = p.toString();
  history.replaceState(null, '', location.pathname + location.search + (h ? '#' + h : ''));
}

function projectsReportParams() {
  return (activeDivision === 'all' ? '' : '&division=' + activeDivision)
       + (activeCategory === 'all' ? '' : '&category=' + activeCategory);
}

const inDivision = (p, d) => d === 'all' || (d === 'unset' ? !p.division : p.division === d);
const inCategory = (p, c) => c === 'all' || (c === 'unset' ? !p.category : p.category === c);

function setDivision(d) {
  activeDivision = d;
  writeProjectHash();
  renderProjects();
}
function setCategory(c) {
  activeCategory = c;
  writeProjectHash();
  renderProjects();
}

function showAddPanel(title) {
  document.getElementById('form-title').textContent = title;
  // A new project started from a division tab / category chip belongs there.
  if (!document.getElementById('editing-id').value) {
    document.getElementById('p-division').value = DIVISION_LABELS[activeDivision] ? activeDivision : '';
    document.getElementById('p-category').value = CATEGORY_LABELS[activeCategory] ? activeCategory : '';
  }
  document.getElementById('add-panel').style.display = 'block';
  document.getElementById('show-add-btn').style.display = 'none';
}
function hideAddPanel() {
  document.getElementById('add-panel').style.display = 'none';
  document.getElementById('show-add-btn').style.display = '';
  document.getElementById('project-form').reset();
  document.getElementById('editing-id').value = '';
}
document.getElementById('show-add-btn').addEventListener('click', () => showAddPanel('New project'));
document.getElementById('cancel-btn').addEventListener('click', hideAddPanel);

function isoToDateInput(iso) { return iso ? iso.substring(0, 10) : ''; }

function editProject(id) {
  const p = projectsCache.find(x => x.id === id);
  if (!p) return;
  const form = document.getElementById('project-form');
  form.name.value = p.name; form.customer_id.value = p.customer_id;
  form.division.value = p.division || '';
  form.category.value = p.category || '';
  form.start_date.value = isoToDateInput(p.start_date);
  form.target_completion_date.value = isoToDateInput(p.target_completion_date);
  form.site_address.value = p.site_address || ''; form.notes.value = p.notes || '';
  document.getElementById('editing-id').value = id;
  showAddPanel('Edit project');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Deleting a project. With no quotations attached it's a simple confirm;
// otherwise a dialog asks whether to keep the quotations (unlinked) or
// delete them too. Stock movements are always kept, just unlinked.
async function deleteProject(id, name) {
  let links;
  try { links = await api(`/projects/${id}/links`); } catch (err) { toast(err.message, true); return; }
  const moves = links.stock_movements;
  const moveNote = moves ? ` Its ${moves} stock movement${moves === 1 ? '' : 's'} will be kept (stock levels don't change).` : '';
  if (!links.quotations.length) {
    if (!confirm(`Delete project "${name}"? This removes its status history too.${moveNote}`)) return;
    return doDeleteProject(id, '');
  }
  const qs = links.quotations;
  document.getElementById('del-sub').textContent = name;
  document.getElementById('del-body').innerHTML =
    `<p style="margin:0 0 8px;">This project has ${qs.length} quotation${qs.length === 1 ? '' : 's'} linked to it: ` +
    `<strong>${qs.map(q => escHtml(q.quote_number)).join(', ')}</strong>.</p>` +
    `<p style="margin:0; color:var(--muted);">Keep them (they stay in Quotations, no longer linked to a project), or delete them with the project.${escHtml(moveNote)}</p>`;
  document.getElementById('del-keep').onclick = () => doDeleteProject(id, 'keep');
  document.getElementById('del-all').onclick = () => {
    if (confirm(`Permanently delete ${qs.length} quotation${qs.length === 1 ? '' : 's'} with this project?`)) doDeleteProject(id, 'delete');
  };
  document.getElementById('del-overlay').classList.add('open');
}

function closeDeleteDialog() {
  document.getElementById('del-overlay').classList.remove('open');
}

async function doDeleteProject(id, quotations) {
  closeDeleteDialog();
  try {
    await api('/projects/' + id + (quotations ? '?quotations=' + quotations : ''), { method: 'DELETE' });
    toast(quotations === 'delete' ? 'Project and its quotations deleted'
      : quotations === 'keep' ? 'Project deleted, quotations kept' : 'Project deleted');
    loadProjects();
  } catch (err) { toast(err.message, true); }
}

async function loadCustomerOptions() {
  customersCache = await api('/customers/');
  document.getElementById('p-customer').innerHTML = customersCache.map(c => `<option value="${c.id}">${c.name}${c.company ? ' — ' + c.company : ''}</option>`).join('');
}

async function loadProjects() {
  projectsCache = await api('/projects/');
  renderProjects();
}

function renderProjects() {
  // Division tabs. "Not set" only shows while some project has no division.
  const unsetDiv = projectsCache.filter(p => !p.division).length;
  if (activeDivision === 'unset' && !unsetDiv) activeDivision = 'all';
  const divs = ['all', 'lighting', 'automation', ...(unsetDiv ? ['unset'] : [])];
  document.getElementById('division-tabs').innerHTML = divs.map(d => {
    const n = projectsCache.filter(p => inDivision(p, d)).length;
    const label = d === 'all' ? 'All' : d === 'unset' ? 'Division not set' : DIVISION_LABELS[d];
    const on = d === activeDivision;
    return `<button type="button" class="tab${on ? ' active' : ''}" role="tab" aria-selected="${on}" data-div="${d}"
      onclick="setDivision('${d}')">${label} <span class="tab-count">${n}</span></button>`;
  }).join('');

  // Retail / Residential chips, counted within the division showing
  const inDiv = projectsCache.filter(p => inDivision(p, activeDivision));
  const unsetCat = inDiv.filter(p => !p.category).length;
  if (activeCategory === 'unset' && !unsetCat) activeCategory = 'all';
  const cats = ['all', 'retail', 'residential', ...(unsetCat ? ['unset'] : [])];
  document.getElementById('category-chips').innerHTML = cats.map(c => {
    const n = inDiv.filter(p => inCategory(p, c)).length;
    const label = c === 'all' ? 'All categories' : c === 'unset' ? 'Category not set' : CATEGORY_LABELS[c];
    return `<button type="button" class="chip${c === activeCategory ? ' active' : ''}${n || c === activeCategory ? '' : ' zero'}"
      data-cat="${c}" onclick="setCategory('${c}')">${label}<span class="n">${n}</span></button>`;
  }).join('');

  let rows = inDiv.filter(p => inCategory(p, activeCategory));
  // Filter from the dashboard: ?stage=quoted, or a group (open / orders)
  const stageParam = new URLSearchParams(location.search).get('stage');
  const GROUPS = { open: ['enquiry', 'quoted'], orders: ['approved', 'ordered', 'delivered', 'installed', 'commissioned'] };
  const GROUP_LABEL = { open: 'Pipeline (Enquiry & Quoted)', orders: 'Order book (Approved to Commissioned)' };
  const sf = document.getElementById('stage-filter');
  if (stageParam) {
    const set = GROUPS[stageParam] || [stageParam];
    rows = rows.filter(p => set.includes(p.status));
    const label = GROUP_LABEL[stageParam] || (stageParam.charAt(0).toUpperCase() + stageParam.slice(1));
    sf.innerHTML = `Showing <strong>${label}</strong> <a href="/projects" class="sf-clear" title="Show all">✕</a>`;
    sf.style.display = 'inline-flex';
  } else { sf.style.display = 'none'; }
  let emptyMessage = 'No projects yet — create your first one above to start tracking its live status.';
  if (projectsCache.length && (activeDivision !== 'all' || activeCategory !== 'all')) {
    const words = [DIVISION_LABELS[activeDivision], CATEGORY_LABELS[activeCategory]].filter(Boolean).join(' ').toLowerCase();
    emptyMessage = words
      ? `No ${words} projects yet. Set a project's division and category from Edit, or create a new one here.`
      : 'No projects here.';
  }
  if (projectsCache.length && stageParam) {
    const words = [DIVISION_LABELS[activeDivision], CATEGORY_LABELS[activeCategory]].filter(Boolean).join(' ').toLowerCase();
    emptyMessage = `No ${words ? words + ' ' : ''}projects at this stage right now.`;
  }

  DataTable.render({
    containerId: 'projects-table',
    storageKey: 'projects',
    emptyMessage: emptyMessage,
    columns: [
      { key: 'project_number', label: 'Project #', value: p => p.project_number || '', render: p => `<a href="/projects/view/${p.id}" class="mono">${p.project_number}</a>` },
      { key: 'name', label: 'Name', value: p => p.name, render: p => `<a href="/projects/view/${p.id}">${p.name}</a>` },
      { key: 'customer', label: 'Customer', value: p => { const c = customersCache.find(x => x.id === p.customer_id); return c ? c.name : ''; }, render: p => { const c = customersCache.find(x => x.id === p.customer_id); return c ? `<a class="panel-link" href="/customers/view/${c.id}">${c.name}</a>` : '—'; } },
      { key: 'division', label: 'Division', value: p => DIVISION_LABELS[p.division] || '', render: p => p.division ? `<span class="badge div-${p.division}">${DIVISION_LABELS[p.division]}</span>` : '<span class="muted">Not set</span>' },
      { key: 'category', label: 'Category', value: p => CATEGORY_LABELS[p.category] || '', render: p => p.category ? `<span class="badge cat-${p.category}">${CATEGORY_LABELS[p.category]}</span>` : '<span class="muted">Not set</span>' },
      { key: 'status', label: 'Status', value: p => p.status, render: p => `<span class="badge stage-${p.status}">${p.status.charAt(0).toUpperCase() + p.status.slice(1)}</span>` },
      { key: 'start_date', label: 'Started', value: p => p.start_date || '', render: p => fmtDate(p.start_date) },
    ],
    rows: rows,
    actions: p => `
      <a class="btn btn-ghost btn-sm" href="/projects/view/${p.id}">Open</a>
      <button class="btn btn-ghost btn-sm" onclick="editProject(${p.id})">Edit</button>
      <button class="btn btn-ghost btn-sm btn-danger" onclick="deleteProject(${p.id}, '${p.name.replace(/'/g, "\\'")}')">Delete</button>
    `,
  });
}

document.getElementById('project-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = formToJSON(e.target);
  payload.customer_id = parseInt(payload.customer_id);
  const editingId = document.getElementById('editing-id').value;
  try {
    if (editingId) {
      await api('/projects/' + editingId, { method: 'PUT', body: JSON.stringify(payload) });
      toast('Project updated');
      hideAddPanel();
      loadProjects();
    } else {
      const project = await api('/projects/', { method: 'POST', body: JSON.stringify(payload) });
      toast('Project created');
      location.href = '/projects/view/' + project.id;
    }
  } catch (err) { toast(err.message, true); }
});

(async () => {
  await loadCustomerOptions();
  await loadProjects();
  // Link from a customer page: /projects?new=1&customer=3
  const params = new URLSearchParams(location.search);
  if (params.get('new')) {
    showAddPanel('New project');
    if (params.get('customer')) document.getElementById('p-customer').value = params.get('customer');
  }
})();
</script>
{% endblock %}
