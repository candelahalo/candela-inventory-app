{% extends "base.html" %}
{% block title %}Stock{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Stock</h1>
    <p>What's on hand, where, and what's moved recently.</p>
  </div>
  <div class="head-actions">
    <span id="report-btns"></span>
    <button class="btn btn-ghost" id="show-wh-btn">+ Warehouse</button>
    <button class="btn" id="show-move-btn">+ Record movement</button>
  </div>
</div>

<div class="panel" id="wh-panel" style="display:none;">
  <h2 id="wh-form-title">Add a warehouse</h2>
  <form id="warehouse-form">
    <input type="hidden" id="wh-editing-id">
    <div class="form-grid">
      <div class="field"><label>Name</label><input name="name" required placeholder="Main Warehouse"></div>
      <div class="field"><label>Location</label><input name="location" placeholder="Al Quoz, Dubai"></div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn">Save warehouse</button>
      <button type="button" class="btn btn-ghost" id="wh-cancel-btn">Cancel</button>
    </div>
  </form>
</div>

<div class="panel" id="move-panel" style="display:none;">
  <h2>Record a stock movement</h2>
  <form id="movement-form">
    <div class="form-grid">
      <div class="field"><label>Product</label><select name="product_id" id="mv-product" required></select></div>
      <div class="field"><label>Warehouse</label><select name="warehouse_id" id="mv-warehouse" required></select></div>
      <div class="field"><label>Type</label>
        <select name="movement_type">
          <option value="in">Stock in</option>
          <option value="out">Stock out</option>
          <option value="adjustment">Adjustment</option>
        </select>
      </div>
      <div class="field"><label>Quantity</label><input name="quantity" type="number" required></div>
      <div class="field"><label>Project (optional)</label><select name="project_id" id="mv-project"><option value="">— None —</option></select></div>
      <div class="field"><label>Reference</label><input name="reference" placeholder="PO #123, site delivery, ..."></div>
      <div class="field span2"><label>Notes</label><textarea name="notes" rows="2"></textarea></div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn">Save movement</button>
      <button type="button" class="btn btn-ghost" id="move-cancel-btn">Cancel</button>
    </div>
  </form>
</div>

<div class="panel">
  <h2>Warehouses</h2>
  <div id="warehouses-table"></div>
</div>

<div class="tabs" id="category-tabs" role="tablist"></div>

<div class="panel">
  <h2>Stock on hand</h2>
  <div id="levels-table"></div>
</div>

<div class="panel">
  <h2>Recent movements</h2>
  <div id="movements-table"></div>
</div>
{% endblock %}

{% block script %}
<script>
// Both exports follow the category tab that's showing.
document.getElementById('report-btns').innerHTML = exportMenu([
  reportItems('stock', { label: 'Stock on hand', extra: 'stockReportParams()' }),
  reportItems('movements', { label: 'Movements', extra: 'stockReportParams()' }),
]);

// Category tabs: filter stock on hand and recent movements by product
// category. Kept in the URL so a refresh lands on the same tab.
let activeCategory = decodeURIComponent(location.hash.slice(1)) || 'all';
let levelsCache = [];
let movementsCache = [];
const isOtherCategory = c => !PRODUCT_CATEGORIES.includes(c || '');
const inCategory = c => activeCategory === 'all' ? true
  : activeCategory === 'other' ? isOtherCategory(c) : c === activeCategory;
const productCategory = id => { const p = productsCache.find(x => x.id === id); return p ? p.category : null; };

function stockReportParams() {
  return activeCategory === 'all' ? '' : '&category=' + encodeURIComponent(activeCategory);
}

function setCategory(cat) {
  activeCategory = cat;
  history.replaceState(null, '', cat === 'all' ? location.pathname : '#' + encodeURIComponent(cat));
  renderTabs(); renderLevels(); renderMovements();
}

function renderTabs() {
  // Counts are products in stock (distinct product lines), per category
  const count = cat => new Set(levelsCache.filter(l => cat === 'all' ? true
    : cat === 'other' ? isOtherCategory(l.category) : l.category === cat).map(l => l.product_id)).size;
  const cats = ['all', ...PRODUCT_CATEGORIES, ...(count('other') ? ['other'] : [])];
  if (!cats.includes(activeCategory)) activeCategory = 'all';
  document.getElementById('category-tabs').innerHTML = cats.map(c => `
    <button type="button" class="tab${c === activeCategory ? ' active' : ''}" role="tab" aria-selected="${c === activeCategory}"
      onclick="setCategory('${c}')">${c === 'all' ? 'All' : c === 'other' ? 'Other' : c} <span class="tab-count">${count(c)}</span></button>`).join('');
}
let productsCache = [], warehousesCache = [], projectsCache = [];

function showWhPanel(title) { document.getElementById('wh-form-title').textContent = title; document.getElementById('wh-panel').style.display = 'block'; }
function hideWhPanel() { document.getElementById('wh-panel').style.display = 'none'; document.getElementById('warehouse-form').reset(); document.getElementById('wh-editing-id').value = ''; }
document.getElementById('show-wh-btn').addEventListener('click', () => showWhPanel('Add a warehouse'));
document.getElementById('wh-cancel-btn').addEventListener('click', hideWhPanel);
document.getElementById('show-move-btn').addEventListener('click', () => document.getElementById('move-panel').style.display = 'block');
document.getElementById('move-cancel-btn').addEventListener('click', () => document.getElementById('move-panel').style.display = 'none');

function editWarehouse(id) {
  const w = warehousesCache.find(x => x.id === id);
  if (!w) return;
  const form = document.getElementById('warehouse-form');
  form.name.value = w.name; form.location.value = w.location || '';
  document.getElementById('wh-editing-id').value = id;
  showWhPanel('Edit warehouse');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteWarehouse(id, name) {
  if (!confirm(`Delete warehouse "${name}"?`)) return;
  try {
    await api('/stock/warehouses/' + id, { method: 'DELETE' });
    toast('Warehouse deleted');
    populateSelectors();
  } catch (err) { toast(err.message, true); }
}

async function deleteMovement(id) {
  if (!confirm('Delete this stock movement? This will change computed stock levels.')) return;
  try {
    await api('/stock/movements/' + id, { method: 'DELETE' });
    toast('Movement deleted');
    loadLevels();
    loadMovements();
  } catch (err) { toast(err.message, true); }
}

async function populateSelectors() {
  const [products, warehouses, projects] = await Promise.all([api('/products/?active_only=false'), api('/stock/warehouses'), api('/projects/')]);
  productsCache = products; warehousesCache = warehouses; projectsCache = projects;
  document.getElementById('mv-product').innerHTML = products.filter(p => p.is_active !== false).map(p => `<option value="${p.id}">${p.sku} — ${p.name}</option>`).join('');
  document.getElementById('mv-warehouse').innerHTML = warehouses.map(w => `<option value="${w.id}">${w.name}</option>`).join('');
  document.getElementById('mv-project').innerHTML = '<option value="">— None —</option>' + projects.filter(p => p.status !== 'closed').map(p => `<option value="${p.id}">${p.project_number} — ${p.name}</option>`).join('');

  DataTable.render({
    containerId: 'warehouses-table',
    storageKey: 'warehouses',
    emptyMessage: 'No warehouses yet — add one above.',
    columns: [
      { key: 'name', label: 'Name', value: w => w.name, render: w => w.name },
      { key: 'location', label: 'Location', value: w => w.location || '', render: w => w.location || '—' },
    ],
    rows: warehouses,
    actions: w => `
      <button class="btn btn-ghost btn-sm" onclick="editWarehouse(${w.id})">Edit</button>
      <button class="btn btn-ghost btn-sm btn-danger" onclick="deleteWarehouse(${w.id}, '${w.name.replace(/'/g, "\\'")}')">Delete</button>
    `,
  });
}

async function loadLevels() {
  levelsCache = await api('/stock/levels');
  renderTabs();
  renderLevels();
}

function renderLevels() {
  const levels = levelsCache.filter(l => inCategory(l.category));
  DataTable.render({
    containerId: 'levels-table',
    storageKey: 'stock-levels',
    emptyMessage: activeCategory === 'all' ? 'No stock recorded yet — record your first stock-in movement above.' : 'No stock in this category yet.',
    columns: [
      { key: 'sku', label: 'SKU', value: s => s.sku, render: s => `<a class="mono panel-link" href="/products/view/${s.product_id}">${s.sku}</a>` },
      { key: 'name', label: 'Product', value: s => s.name, render: s => s.name },
      { key: 'category', label: 'Category', value: s => s.category || '', render: s => s.category || '—' },
      { key: 'warehouse', label: 'Warehouse', value: s => s.warehouse_name, render: s => s.warehouse_name },
      { key: 'on_hand', label: 'On hand', numeric: true, value: s => s.quantity_on_hand, render: s => s.quantity_on_hand },
      { key: 'reorder', label: 'Reorder level', numeric: true, value: s => s.reorder_level, render: s => s.reorder_level },
      { key: 'status', label: 'Status', value: s => s.below_reorder ? 0 : 1, render: s => s.below_reorder ? '<span class="badge low">Low stock</span>' : '<span class="badge">OK</span>' },
    ],
    rows: levels,
  });
}

async function loadMovements() {
  movementsCache = await api('/stock/movements');
  renderMovements();
}

function renderMovements() {
  const movements = movementsCache.filter(m => inCategory(productCategory(m.product_id)));
  DataTable.render({
    containerId: 'movements-table',
    storageKey: 'stock-movements',
    emptyMessage: 'No movements recorded yet.',
    columns: [
      { key: 'date', label: 'Date', value: m => m.created_at, render: m => fmtDate(m.created_at) },
      { key: 'type', label: 'Type', value: m => m.movement_type, render: m => `<span class="badge">${({ in: 'In', out: 'Out', adjustment: 'Adjustment' })[m.movement_type]}</span>` },
      { key: 'product', label: 'Product', value: m => { const p = productsCache.find(pr => pr.id === m.product_id); return p ? p.sku : ''; }, render: m => {
          const p = productsCache.find(pr => pr.id === m.product_id);
          return p ? `<a class="mono panel-link" href="/products/view/${p.id}">${p.sku}</a> ${p.name}` : '—';
        } },
      { key: 'warehouse', label: 'Warehouse', value: m => { const w = warehousesCache.find(x => x.id === m.warehouse_id); return w ? w.name : ''; }, render: m => { const w = warehousesCache.find(x => x.id === m.warehouse_id); return w ? w.name : '—'; } },
      { key: 'project', label: 'Project', value: m => { const p = projectsCache.find(x => x.id === m.project_id); return p ? p.project_number : ''; }, render: m => { const p = projectsCache.find(x => x.id === m.project_id); return p ? `<a class="panel-link" href="/projects/view/${p.id}">${p.project_number}</a>` : '—'; } },
      { key: 'reference', label: 'Reference', value: m => m.reference || '', render: m => m.reference || '—' },
      { key: 'qty', label: 'Qty', numeric: true, value: m => m.quantity, render: m => m.quantity },
    ],
    rows: movements.slice(0, 40),
    actions: m => `<button class="btn btn-ghost btn-sm btn-danger" onclick="deleteMovement(${m.id})">Delete</button>`,
  });
}

document.getElementById('warehouse-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = formToJSON(e.target);
  const editingId = document.getElementById('wh-editing-id').value;
  try {
    if (editingId) {
      await api('/stock/warehouses/' + editingId, { method: 'PUT', body: JSON.stringify(payload) });
      toast('Warehouse updated');
    } else {
      await api('/stock/warehouses', { method: 'POST', body: JSON.stringify(payload) });
      toast('Warehouse added');
    }
    hideWhPanel();
    populateSelectors();
  } catch (err) { toast(err.message, true); }
});

document.getElementById('movement-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = formToJSON(e.target);
  payload.product_id = parseInt(payload.product_id);
  payload.warehouse_id = parseInt(payload.warehouse_id);
  if (payload.project_id) payload.project_id = parseInt(payload.project_id);
  payload.quantity = parseInt(payload.quantity);
  try {
    await api('/stock/movements', { method: 'POST', body: JSON.stringify(payload) });
    toast(payload.project_id && payload.movement_type === 'out' ? 'Issued to project — its materials list is updated' : 'Movement recorded');
    e.target.reset();
    document.getElementById('move-panel').style.display = 'none';
    loadLevels();
    loadMovements();
  } catch (err) { toast(err.message, true); }
});

(async () => {
  await populateSelectors();
  await loadLevels();
  await loadMovements();
})();
</script>
{% endblock %}
