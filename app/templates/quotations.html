{% extends "base.html" %}
{% block title %}Quotations{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Quotations</h1>
    <p>Prepare professional, standardized pricing for clients.</p>
  </div>
  <button class="btn" id="show-add-btn">+ New quotation</button>
</div>

<div class="panel" id="add-panel" style="display:none;">
  <h2 id="form-title">New quotation</h2>
  <form id="quote-form">
    <input type="hidden" id="editing-id">
    <div class="form-grid">
      <div class="field"><label>Customer</label><select name="customer_id" id="q-customer" required></select></div>
      <div class="field"><label>Project (optional)</label><select name="project_id" id="q-project"><option value="">— None —</option></select></div>
      <div class="field"><label>Attention to</label><input name="attention_to" placeholder="Mr. Aaditya Bhagra & Ms. Rashmi Gulti"></div>
      <div class="field"><label>Subject</label><input name="subject" placeholder="Quotation for Landscape Lighting"></div>
      <div class="field"><label>Currency</label><input name="currency" value="AED"></div>
      <div class="field"><label>Valid until</label><input name="valid_until" type="date"></div>
      <div class="field span2"><label>Scope</label><input name="scope" value="Delivered to site including all expenses"></div>
      <div class="field span2"><label>Delivery time</label><input name="delivery_time" value="7-9 weeks from the date of order confirmation and advance payment"></div>
      <div class="field span2"><label>Payment terms</label><input name="payment_terms" value="70% in advance, balance 30% before delivery."></div>
      <div class="field"><label>Freight & customs (optional)</label><input name="freight_charges" type="number" step="0.01" value="0"></div>
      <div class="field"><label>Transportation (number or text)</label><input name="transportation_charges" value="500" placeholder="500 or Included"></div>
      <div class="field"><label>VAT %</label><input name="vat_percent" type="number" step="0.1" value="5"></div>
      <div class="field"><label>Prepared by (name)</label><input name="prepared_by_name" value="Johns James"></div>
      <div class="field"><label>Prepared by (title)</label><input name="prepared_by_title" value="Division Head - Projects"></div>
      <div class="field span2"><label>Notes</label><textarea name="notes" rows="2"></textarea></div>
    </div>

    <h2 style="margin-top:22px;">Line items</h2>
    <div class="line-items" id="line-items"></div>
    <button type="button" class="btn btn-ghost btn-sm" id="add-line">+ Add line</button>

    <div class="form-actions">
      <button type="submit" class="btn">Save quotation</button>
      <button type="button" class="btn btn-ghost" id="cancel-btn">Cancel</button>
    </div>
  </form>
</div>

<div class="panel">
  <div id="quotations-table"></div>
</div>
{% endblock %}

{% block script %}
<script>
let productsCache = [], customersCache = [], projectsCache = [];

function lineRow(item) {
  const opts = productsCache.map(p => `<option value="${p.id}" data-price="${p.selling_price}" data-spec="${(p.spec_summary||'').replace(/"/g,'&quot;')}" data-image="${p.image_path||''}">${p.sku} — ${p.name}</option>`).join('');
  return `<div class="line-item-block">
    <div class="line-item-row">
      <div class="field"><label>Photo</label><img class="li-photo" style="width:44px;height:44px;object-fit:contain;border:1px solid var(--line);border-radius:4px;background:#fff;">
      </div>
      <div class="field"><label>Product</label><select class="li-product">${opts}</select></div>
      <div class="field"><label>Type code</label><input class="li-type" placeholder="WL1" value="${item && item.type_code ? item.type_code : ''}"></div>
      <div class="field"><label>Qty</label><input class="li-qty" type="number" value="${item ? item.quantity : 1}" min="1"></div>
      <div class="field"><label>Unit price</label><input class="li-price" type="number" step="0.01" value="${item ? item.unit_price : 0}"></div>
      <div class="field"><label>Disc %</label><input class="li-disc" type="number" step="0.1" value="${item ? item.discount_pct : 0}"></div>
      <button type="button" class="remove-line" onclick="this.closest('.line-item-block').remove()">×</button>
    </div>
    <div class="field" style="padding: 0 12px 12px;"><label>Description (defaults from product spec)</label><textarea class="li-desc" rows="2">${item && item.description ? item.description : ''}</textarea></div>
  </div>`;
}

function addLine(item) {
  const container = document.getElementById('line-items');
  container.insertAdjacentHTML('beforeend', lineRow(item));
  const blocks = container.querySelectorAll('.line-item-block');
  const block = blocks[blocks.length - 1];
  const sel = block.querySelector('.li-product');
  const priceInput = block.querySelector('.li-price');
  const photo = block.querySelector('.li-photo');
  const descArea = block.querySelector('.li-desc');
  if (item) sel.value = item.product_id;
  const sync = () => {
    const opt = sel.selectedOptions[0];
    if (!opt) return;
    photo.src = opt.dataset.image || '';
    photo.style.display = opt.dataset.image ? 'block' : 'none';
  };
  sel.addEventListener('change', () => {
    const opt = sel.selectedOptions[0];
    priceInput.value = opt.dataset.price;
    descArea.value = opt.dataset.spec || '';
    sync();
  });
  // For a brand-new line, prefill price and spec from the preselected product.
  // When editing an existing line, keep the values that were saved on the quotation.
  if (!item) {
    const opt = sel.selectedOptions[0];
    if (opt) {
      priceInput.value = opt.dataset.price;
      descArea.value = opt.dataset.spec || '';
    }
  }
  sync();
}

document.getElementById('add-line').addEventListener('click', () => addLine());

function showAddPanel(title) {
  document.getElementById('form-title').textContent = title;
  document.getElementById('add-panel').style.display = 'block';
  document.getElementById('show-add-btn').style.display = 'none';
}
function hideAddPanel() {
  document.getElementById('add-panel').style.display = 'none';
  document.getElementById('show-add-btn').style.display = '';
  document.getElementById('quote-form').reset();
  document.getElementById('editing-id').value = '';
  document.getElementById('line-items').innerHTML = '';
}
document.getElementById('show-add-btn').addEventListener('click', () => { showAddPanel('New quotation'); if (!document.getElementById('line-items').children.length) addLine(); });
document.getElementById('cancel-btn').addEventListener('click', hideAddPanel);

async function editQuotation(id) {
  const q = await api('/quotations/' + id);
  const form = document.getElementById('quote-form');
  form.customer_id.value = q.customer_id;
  form.project_id.value = q.project_id || '';
  form.attention_to.value = q.attention_to || '';
  form.subject.value = q.subject || '';
  form.currency.value = q.currency;
  form.valid_until.value = q.valid_until ? q.valid_until.substring(0, 10) : '';
  form.scope.value = q.scope || '';
  form.delivery_time.value = q.delivery_time || '';
  form.payment_terms.value = q.payment_terms || '';
  form.freight_charges.value = q.freight_charges;
  form.transportation_charges.value = q.transportation_charges || '';
  form.vat_percent.value = q.vat_percent;
  form.prepared_by_name.value = q.prepared_by_name || '';
  form.prepared_by_title.value = q.prepared_by_title || '';
  form.notes.value = q.notes || '';
  document.getElementById('editing-id').value = id;
  document.getElementById('line-items').innerHTML = '';
  q.items.forEach(item => addLine(item));
  showAddPanel('Edit quotation ' + q.quote_number);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function loadFormData() {
  const [products, customers, projects] = await Promise.all([api('/products/'), api('/customers/'), api('/projects/')]);
  productsCache = products; customersCache = customers; projectsCache = projects;
  document.getElementById('q-customer').innerHTML = customers.map(c => `<option value="${c.id}">${c.name}${c.company ? ' — ' + c.company : ''}</option>`).join('');
  document.getElementById('q-project').innerHTML += projects.map(p => `<option value="${p.id}">${p.project_number} — ${p.name}</option>`).join('');
  if (!document.getElementById('line-items').children.length) addLine();
}

async function loadQuotations() {
  const quotes = await api('/quotations/');
  DataTable.render({
    containerId: 'quotations-table',
    storageKey: 'quotations',
    emptyMessage: 'No quotations yet — create your first one above.',
    columns: [
      { key: 'quote_number', label: 'Quote #', value: q => q.quote_number || '', render: q => `<span class="mono">${q.quote_number}</span>` },
      { key: 'customer', label: 'Customer', value: q => { const c = customersCache.find(x => x.id === q.customer_id); return c ? c.name : ''; }, render: q => { const c = customersCache.find(x => x.id === q.customer_id); return c ? c.name : '—'; } },
      { key: 'project', label: 'Project', value: q => { const p = projectsCache.find(x => x.id === q.project_id); return p ? p.project_number : ''; }, render: q => { const p = projectsCache.find(x => x.id === q.project_id); return p ? p.project_number : '—'; } },
      { key: 'status', label: 'Status', value: q => q.status, render: q => `<span class="badge">${q.status}</span>` },
      { key: 'total', label: 'Total (incl. VAT)', numeric: true, value: q => q.total_with_vat, render: q => fmtMoney(q.total_with_vat) },
      { key: 'date', label: 'Date', value: q => q.created_at, render: q => fmtDate(q.created_at) },
    ],
    rows: quotes,
    actions: q => `
      <a class="btn btn-ghost btn-sm" href="/quotations/${q.id}/pdf">PDF</a>
      <a class="btn btn-ghost btn-sm" href="/quotations/${q.id}/excel">Excel</a>
      <button class="btn btn-ghost btn-sm" onclick="editQuotation(${q.id})">Edit</button>
      <button class="btn btn-ghost btn-sm btn-danger" onclick="deleteQuotation(${q.id}, '${q.quote_number}')">Delete</button>
    `,
  });
}

async function deleteQuotation(id, quoteNumber) {
  if (!confirm(`Delete quotation ${quoteNumber}?`)) return;
  try {
    await api('/quotations/' + id, { method: 'DELETE' });
    toast('Quotation deleted');
    loadQuotations();
  } catch (err) { toast(err.message, true); }
}

document.getElementById('quote-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const items = [...document.querySelectorAll('.line-item-block')].map(block => ({
    product_id: parseInt(block.querySelector('.li-product').value),
    type_code: block.querySelector('.li-type').value || null,
    description: block.querySelector('.li-desc').value || null,
    quantity: parseInt(block.querySelector('.li-qty').value),
    unit_price: parseFloat(block.querySelector('.li-price').value),
    discount_pct: parseFloat(block.querySelector('.li-disc').value || 0),
  }));
  if (!items.length) { toast('Add at least one line item', true); return; }

  const payload = formToJSON(form);
  payload.customer_id = parseInt(payload.customer_id);
  if (payload.project_id) payload.project_id = parseInt(payload.project_id);
  payload.freight_charges = parseFloat(payload.freight_charges || 0);
  payload.vat_percent = parseFloat(payload.vat_percent || 0);
  // Sent as a string so it can hold either a figure ("500") or words ("Included")
  payload.transportation_charges = (form.transportation_charges.value || '').trim();
  payload.items = items;
  const editingId = document.getElementById('editing-id').value;

  try {
    if (editingId) {
      await api('/quotations/' + editingId, { method: 'PUT', body: JSON.stringify(payload) });
      toast('Quotation updated');
    } else {
      await api('/quotations/', { method: 'POST', body: JSON.stringify(payload) });
      toast('Quotation created');
    }
    hideAddPanel();
    loadQuotations();
  } catch (err) { toast(err.message, true); }
});

(async () => {
  await loadFormData();
  await loadQuotations();
})();
</script>
{% endblock %}
