<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Candela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=29">
</head>
<body class="login-body">
  <div class="login-card">
    <img src="/static/candela-logo-dark.png" alt="Candela" class="login-logo">
    <h1>Sign in</h1>
    <p class="login-sub">Inventory, stock, quotations & projects</p>

    <form id="login-form">
      <div class="field"><label>Username</label><input name="username" autocomplete="username" required autofocus></div>
      <div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div>
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="btn" style="width:100%; justify-content:center; margin-top:6px;">Sign in</button>
    </form>
  </div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('login-error');
  err.textContent = '';

  // The login endpoint takes form-encoded credentials (OAuth2 standard),
  // not JSON, so this one request doesn't use the api() helper.
  const body = new URLSearchParams();
  body.append('username', e.target.username.value);
  body.append('password', e.target.password.value);

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body,
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.detail || 'Sign in failed');
    }
    const data = await res.json();
    localStorage.setItem('candela_token', data.access_token);
    localStorage.setItem('candela_user', JSON.stringify({
      username: data.username, full_name: data.full_name,
      role: data.role, screens: data.screens,
    }));
    location.href = '/';
  } catch (e2) {
    err.textContent = e2.message;
  }
});
</script>
</body>
</html>
