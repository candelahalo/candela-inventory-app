{% extends "base.html" %}
{% block title %}Activity{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Activity</h1>
    <p>Who created, changed, or removed what, across the whole app.</p>
  </div>
  <div class="head-actions">
    <button type="button" class="btn btn-ghost btn-sm" onclick="downloadReport('activity','pdf')">PDF</button>
    <button type="button" class="btn btn-ghost btn-sm" onclick="downloadReport('activity','xlsx')">Excel</button>
  </div>
</div>

<div class="panel">
  <div class="form-grid" style="grid-template-columns: 1fr; margin-bottom:18px;">
    <div class="field"><label>Filter by area</label>
      <select id="filter-entity">
        <option value="">Everything</option>
        <option value="product">Products</option>
        <option value="customer">Customers</option>
        <option value="warehouse">Warehouses</option>
        <option value="stock_movement">Stock movements</option>
        <option value="quotation">Quotations</option>
        <option value="project">Projects</option>
        <option value="datasheet">Datasheets</option>
      </select>
    </div>
  </div>
  <div id="activity-table"></div>
</div>
{% endblock %}

{% block script %}
<script>
const ACTION_LABELS = { created: 'Created', updated: 'Updated', deleted: 'Deleted', status_changed: 'Status changed' };
const ENTITY_LABELS = { product: 'Product', customer: 'Customer', warehouse: 'Warehouse', stock_movement: 'Stock movement', quotation: 'Quotation', project: 'Project', datasheet: 'Datasheet' };

async function loadActivity() {
  const entityType = document.getElementById('filter-entity').value;
  const query = entityType ? '?entity_type=' + entityType : '';
  const entries = await api('/activity/' + query);

  DataTable.render({
    containerId: 'activity-table',
    storageKey: 'activity',
    emptyMessage: 'No activity recorded yet.',
    columns: [
      { key: 'when', label: 'Date & time', value: e => e.created_at, render: e => `<span class="mono">${fmtDateTime(e.created_at)}</span>` },
      { key: 'user', label: 'User', value: e => e.performed_by, render: e => e.performed_by },
      { key: 'area', label: 'Area', value: e => e.entity_type, render: e => `<span class="badge">${ENTITY_LABELS[e.entity_type] || e.entity_type}</span>` },
      { key: 'action', label: 'Action', value: e => e.action, render: e => ACTION_LABELS[e.action] || e.action },
      { key: 'item', label: 'Item', value: e => e.entity_label || '', render: e => e.entity_label || '—' },
      { key: 'details', label: 'Details', value: e => e.details || '', render: e => e.details || '—' },
    ],
    rows: entries,
  });
}

document.getElementById('filter-entity').addEventListener('change', loadActivity);
loadActivity();
</script>
{% endblock %}
